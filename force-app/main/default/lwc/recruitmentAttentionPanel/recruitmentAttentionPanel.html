<template>
    <div class="attention-panel-card slds-box slds-theme_default slds-m-bottom_medium">

        <!-- HEADER -->
        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small slds-border_bottom slds-p-bottom_small">
            <div class="slds-col slds-size_9-of-12 slds-media slds-media_center">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:warning" size="medium" variant="warning"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-text-heading_medium slds-truncate"><strong>Recruitment Attention & Operational Signals</strong></h2>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Deterministic, explainable operational signals across candidate coverage, pipeline bottlenecks, skill shortages, and overdue interviews.
                    </p>
                </div>
            </div>
            <div class="slds-col slds-size_3-of-12 slds-text-align_right">
                <lightning-button-group>
                    <lightning-button label="Refresh" icon-name="utility:refresh" size="small" onclick={refresh}></lightning-button>
                    <lightning-button label="Ask Copilot" icon-name="utility:einstein" variant="brand" size="small" onclick={handleAskCopilot}></lightning-button>
                </lightning-button-group>
            </div>
        </div>

        <!-- SUMMARY CARDS -->
        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
            <!-- High Attention -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                <div class="kpi-metric-box metric-high slds-p-around_small slds-grid slds-grid_vertical-align-center">
                    <div class="slds-m-right_small">
                        <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                    </div>
                    <div>
                        <div class="metric-number slds-text-color_error">{data.totalHighAttentionCount}</div>
                        <div class="metric-label">High Attention</div>
                    </div>
                </div>
            </div>
            <!-- Requires Recruiter Review -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                <div class="kpi-metric-box metric-review slds-p-around_small slds-grid slds-grid_vertical-align-center">
                    <div class="slds-m-right_small">
                        <lightning-icon icon-name="utility:warning" size="small" variant="warning"></lightning-icon>
                    </div>
                    <div>
                        <div class="metric-number" style="color: #c25900;">{data.totalRequiresReviewCount}</div>
                        <div class="metric-label">Requires Review</div>
                    </div>
                </div>
            </div>
            <!-- Overdue Interviews -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                <div class="kpi-metric-box metric-interview slds-p-around_small slds-grid slds-grid_vertical-align-center">
                    <div class="slds-m-right_small">
                        <lightning-icon icon-name="standard:service_appointment" size="small"></lightning-icon>
                    </div>
                    <div>
                        <div class="metric-number slds-text-color_error">{data.totalOverdueInterviews}</div>
                        <div class="metric-label">Overdue Interviews</div>
                    </div>
                </div>
            </div>
            <!-- Requisitions Needing Attention -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-m-bottom_x-small">
                <div class="kpi-metric-box metric-jobs slds-p-around_small slds-grid slds-grid_vertical-align-center">
                    <div class="slds-m-right_small">
                        <lightning-icon icon-name="standard:job_position" size="small"></lightning-icon>
                    </div>
                    <div>
                        <div class="metric-number slds-text-color_weak">{data.totalJobsNeedingAttention}</div>
                        <div class="metric-label">Jobs With Signals</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FILTER BAR -->
        <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_small">
            <div class="slds-grid slds-gutters slds-wrap slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <lightning-combobox
                        name="jobSelect"
                        label="Filter by Job Requisition"
                        value={selectedJobId}
                        options={jobOptions}
                        onchange={handleJobChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        name="sevSelect"
                        label="Filter by Severity"
                        value={selectedSeverity}
                        options={severityOptions}
                        onchange={handleSeverityChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-text-align_right">
                    <lightning-button label="Reset Filters" icon-name="utility:clear" size="small" onclick={handleReset}></lightning-button>
                </div>
            </div>
        </div>

        <!-- CATEGORY NAVIGATION TABS -->
        <div class="slds-tabs_default slds-m-bottom_small">
            <ul class="slds-tabs_default__nav" role="tablist">
                <template for:each={categoryTabs} for:item="tab">
                    <li key={tab.id}
                        class={tab.tabClass}
                        role="presentation">
                        <a class="slds-tabs_default__link"
                           role="tab"
                           data-id={tab.id}
                           onclick={handleTabSelect}>
                            <strong>{tab.label}</strong>
                        </a>
                    </li>
                </template>
            </ul>
        </div>

        <!-- LOADING SPINNER -->
        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Evaluating recruitment signals..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- SIGNAL CARDS LIST -->
        <template if:false={isLoading}>
            <template if:true={hasSignals}>
                <div class="slds-m-top_small">
                    <template for:each={displaySignals} for:item="sig">
                        <div key={sig.signalId} class={sig.cardClass}>
                            <!-- Header Row -->
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                <div class="slds-col slds-size_9-of-12">
                                    <span class="slds-badge slds-badge_lightest slds-m-right_x-small">{sig.signalType}</span>
                                    <span class={sig.badgeClass}>
                                        {sig.severity}
                                    </span>
                                    <strong class="slds-text-heading_small">{sig.title}</strong>
                                    <template if:true={sig.jobTitle}>
                                        <span class="slds-badge slds-badge_inverse slds-m-left_x-small">{sig.jobTitle}</span>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_3-of-12 slds-text-align_right">
                                    <span class="slds-text-body_small slds-text-color_weak">Requires Recruiter Review</span>
                                </div>
                            </div>

                            <!-- Evidence (WHAT data supports it) -->
                            <div class="evidence-box slds-p-around_x-small slds-m-bottom_x-small">
                                <lightning-icon icon-name="utility:info_alt" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                <strong>Observed Evidence:</strong> {sig.evidence}
                            </div>

                            <!-- Explanation (WHY attention was raised) -->
                            <div class="explanation-text slds-m-bottom_small">
                                {sig.explanation}
                            </div>

                            <!-- Action Bar -->
                            <div class="action-bar slds-p-top_x-small slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-size_6-of-12">
                                    <span class="slds-text-body_small slds-text-color_weak">
                                        <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Deterministic rule evaluation
                                    </span>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-text-align_right">
                                    <lightning-button-group>
                                        <template if:true={sig.jobId}>
                                            <lightning-button
                                                label="View Job"
                                                size="small"
                                                icon-name="utility:open"
                                                data-jobid={sig.jobId}
                                                onclick={handleViewJob}>
                                            </lightning-button>
                                        </template>
                                        <lightning-button
                                            label="Match Intelligence"
                                            size="small"
                                            icon-name="custom:custom62"
                                            onclick={handleMatchIntelligence}>
                                        </lightning-button>
                                        <lightning-button
                                            label="Compare Candidates"
                                            size="small"
                                            icon-name="utility:multi_picklist"
                                            onclick={handleCandidateComparison}>
                                        </lightning-button>
                                        <template if:true={sig.relatedRecordId}>
                                            <lightning-button
                                                label="View Record"
                                                size="small"
                                                icon-name="utility:preview"
                                                data-ivid={sig.relatedRecordId}
                                                onclick={handleViewInterview}>
                                            </lightning-button>
                                        </template>
                                        <lightning-button
                                            label="Copilot"
                                            variant="brand"
                                            size="small"
                                            icon-name="utility:einstein"
                                            data-title={sig.title}
                                            onclick={handleAskCopilot}>
                                        </lightning-button>
                                    </lightning-button-group>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- EMPTY STATE -->
            <template if:false={hasSignals}>
                <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:success" size="large" variant="success" class="slds-m-bottom_small"></lightning-icon>
                    <div class="slds-text-heading_medium slds-m-bottom_xx-small">No Attention Signals Found</div>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        Current data indicates candidate coverage and interview activity meet healthy operational benchmarks for the selected filters.
                    </p>
                </div>
            </template>
        </template>

        <!-- RESPONSIBLE AI FOOTER -->
        <div class="slds-m-top_medium slds-p-top_small slds-border_top slds-text-align_center">
            <p class="slds-text-body_small slds-text-color_weak">
                <em>{data.responsibleAiNotice}</em>
            </p>
        </div>

    </div>
</template>
